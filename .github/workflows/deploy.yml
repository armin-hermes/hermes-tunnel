name: Deploy Hermes Tunnel to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Pages Project & Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Checking/Creating Cloudflare Pages project 'hermes-tunnel'..."
          npx wrangler pages project create hermes-tunnel --production-branch=main || true
          echo "Deploying public folder to Cloudflare Pages..."
          npx wrangler pages deploy public --project-name=hermes-tunnel --branch=main --commit-dirty=true
