name: Verify Clean Hermes Engine
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Endpoints
        run: |
          set -e
          echo "=== 1. HTML Title ==="
          curl -s "https://hermes-tunnel.armin-hermes.workers.dev/" | grep -o "<title>[^<]*</title>"
          
          echo "=== 2. Wireguard Conf ==="
          curl -s "https://hermes-tunnel.armin-hermes.workers.dev/sub?format=wireguard" | head -n 6
          
          echo "=== 3. Sing-box Gemini Outbound ==="
          curl -s "https://hermes-tunnel.armin-hermes.workers.dev/sub?format=singbox" | grep -A 10 "WARP-GEMINI-UNBLOCK" | head -n 12
          
          echo "=== 4. VLESS Base64 Decoded ==="
          curl -s "https://hermes-tunnel.armin-hermes.workers.dev/sub" | base64 -d | head -n 3
