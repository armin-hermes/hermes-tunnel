name: Deploy BPB Worker Panel to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [ bpb ]

jobs:
  deploy-bpb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup & Build BPB Panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "Fetching latest official BPB worker.js..."
          curl -sL "https://github.com/bia-pain-bache/BPB-Worker-Panel/releases/latest/download/worker.js" -o raw_worker.js
          
          echo "Creating / Verifying KV Namespace..."
          KV_CREATE_OUT=$(npx wrangler kv namespace create kv || true)
          echo "$KV_CREATE_OUT"
          KV_ID=$(echo "$KV_CREATE_OUT" | grep -oE 'id = "[^"]+"' | cut -d'"' -f2 || true)
          
          if [ -z "$KV_ID" ]; then
            echo "Checking existing KV namespaces..."
            KV_ID=$(npx wrangler kv namespace list | jq -r '.[] | select(.title | contains("kv")) | .id' | head -n 1 || true)
          fi
          
          if [ -z "$KV_ID" ]; then
            echo "ERROR: Failed to obtain KV namespace ID. Check if Workers KV Storage permission is granted on the token."
            exit 1
          fi
          
          echo "Found KV Namespace ID: $KV_ID"
          
          # Generate settings and built worker
          python3 - <<PYEOF
          import json, random, datetime, os
          
          raw_worker = open("raw_worker.js").read()
          
          def rand_string(charset, min_len, max_len):
              l = random.randint(min_len, max_len)
              return "".join(random.choice(charset) for _ in range(l))
          
          charset_alpha = "abcdefghijklmnopqrstuvwxyz0123456789"
          charset_path = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456780-_"
          charset_pass = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@$&*_-+;:,."
          
          import uuid
          vl_uuid = str(uuid.uuid4())
          tr_pass = "HermesArmin2026!"
          secure_path = rand_string(charset_path, 16, 20)
          
          settings = {
              "accID": "$CLOUDFLARE_ACCOUNT_ID",
              "accEmail": "armin-hermes@agentmail.to",
              "apiToken": "$CLOUDFLARE_API_TOKEN",
              "vlUUID": vl_uuid,
              "trPass": tr_pass,
              "securePath": secure_path,
              "proxyIpMode": "proxyip",
              "proxyIPs": [],
              "prefixes": [],
              "fallback": "",
              "dohUrl": "",
              "mainDomain": "bpb-panel.armin-hermes.workers.dev"
          }
          
          var_count = random.randint(40, 80)
          rand_lines = []
          for i in range(var_count):
              v_name = f"__var_{rand_string(charset_alpha, 8, 14)}_{i}"
              rand_lines.append(f"let {v_name} = {random.randint(0, 9999)};")
          
          rand_code = "\\n".join(rand_lines)
          timestamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z")
          
          header = f"""// armin-hermes@agentmail.to
          // {timestamp}
          // @ts-nocheck
          {rand_code}
          const EMBEDED_SETTINGS = {json.dumps(settings)};
          """
          
          with open("bpb_worker.js", "w") as f:
              f.write(header + "\\n" + raw_worker)
          
          with open("panel_info.txt", "w") as f:
              f.write(f"PATH={secure_path}\\nPASS={tr_pass}\\nUUID={vl_uuid}")
          
          print("Built bpb_worker.js successfully!")
          PYEOF
          
          cat << TOML > wrangler.toml
          name = "bpb-panel"
          main = "bpb_worker.js"
          compatibility_date = "2024-09-23"
          compatibility_flags = ["nodejs_compat"]
          workers_dev = true
          
          [[kv_namespaces]]
          binding = "kv"
          id = "$KV_ID"
          TOML
          
          echo "Deploying BPB Worker to Cloudflare..."
          npx wrangler deploy
          
          echo "========================================="
          echo "BPB PANEL DEPLOYED SUCCESSFULLY!"
          cat panel_info.txt
          echo "========================================="
